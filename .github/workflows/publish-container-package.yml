name: Publish Container Package

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Additional image tag to publish"
        required: false
        default: "kubernetes-latest"
  push:
    branches:
      - main
      - Kubernetes
    paths:
      - ".github/workflows/publish-container-package.yml"
      - "Docker/**"
      - "Kubernetes/**"
      - "compare_codeplug_html.py"
      - "tablediff/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/thilob/tablediffgenerator-web

jobs:
  publish:
    name: Build and publish web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        # docker/login-action@v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          tags="${IMAGE_NAME}:kubernetes-latest"
          tags="${tags}"$'\n'"${IMAGE_NAME}:kubernetes-${short_sha}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.image_tag }}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${{ inputs.image_tag }}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags}"$'\n'"${IMAGE_NAME}:${version}"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        # docker/build-push-action@v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=TableDiffGenerator Web
            org.opencontainers.image.description=Web portal for comparing exported HTML table reports
            org.opencontainers.image.source=https://github.com/thilob/TableDiffGenerator
            org.opencontainers.image.revision=${{ github.sha }}
