apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tablediffgenerator.fullname" . }}
  labels:
    {{- include "tablediffgenerator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tablediffgenerator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tablediffgenerator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tablediffgenerator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.container.port | quote }}
            - name: MAX_UPLOAD_SIZE
              value: {{ .Values.container.maxUploadSize | quote }}
            - name: MAX_FILE_SIZE
              value: {{ .Values.container.maxFileSize | quote }}
            - name: MAX_TABLES_PER_FILE
              value: {{ .Values.container.maxTablesPerFile | quote }}
            - name: MAX_ROWS_PER_TABLE
              value: {{ .Values.container.maxRowsPerTable | quote }}
            - name: MAX_CELLS_PER_TABLE
              value: {{ .Values.container.maxCellsPerTable | quote }}
            - name: MAX_CELL_CHARS
              value: {{ .Values.container.maxCellChars | quote }}
            {{- if .Values.auth.enabled }}
            - name: WEB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required when auth.enabled=true" .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.usernameKey | quote }}
            - name: WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required when auth.enabled=true" .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.passwordKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
