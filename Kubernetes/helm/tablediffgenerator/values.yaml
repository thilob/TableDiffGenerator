replicaCount: 1

image:
  repository: tablediffgenerator-web
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # NodePort-Variante fuer lokale Tests ohne Ingress:
  # type: NodePort
  # nodePort: 30080

container:
  port: 8080
  maxUploadSize: "33554432"
  maxFileSize: "8388608"
  maxTablesPerFile: "300"
  maxRowsPerTable: "5000"
  maxCellsPerTable: "20000"
  maxCellChars: "4096"

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: tablediffgenerator.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tmp:
  sizeLimit: 64Mi

auth:
  enabled: false
  existingSecret: ""
  usernameKey: username
  passwordKey: password

nodeSelector: {}
tolerations: []
affinity: {}
